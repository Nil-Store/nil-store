syntax = "proto3";
package nilchain.nilchain.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "nilchain/nilchain/v1/params.proto";
import "nilchain/nilchain/v1/proof.proto";
import "nilchain/nilchain/v1/types.proto"; // ADDED

option go_package = "nilchain/x/nilchain/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/params";
  }

  // Queries a list of Proof items.
  rpc ListProofs(QueryListProofsRequest) returns (QueryListProofsResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/proofs";
  }

  // Queries a list of Deal items.
  rpc ListDeals(QueryListDealsRequest) returns (QueryListDealsResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/deals";
  }

  // Queries a Deal by id.
  rpc GetDeal(QueryGetDealRequest) returns (QueryGetDealResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/deals/{id}";
  }

  // Queries a list of Provider items.
  rpc ListProviders(QueryListProvidersRequest) returns (QueryListProvidersResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/providers";
  }

  // Queries a Provider by address.
  rpc GetProvider(QueryGetProviderRequest) returns (QueryGetProviderResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/providers/{address}";
  }

  // Queries bond state for a Provider by address.
  rpc GetProviderBond(QueryGetProviderBondRequest) returns (QueryGetProviderBondResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/providers/{address}/bond";
  }

  // Queries the Heat State for a Deal.
  rpc GetDealHeat(QueryGetDealHeatRequest) returns (QueryGetDealHeatResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/deals/{deal_id}/heat";
  }

  // Queries HealthState for a Deal/provider assignment.
  rpc GetDealProviderHealth(QueryGetDealProviderHealthRequest) returns (QueryGetDealProviderHealthResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/deals/{deal_id}/health/provider/{provider}";
  }

  // Queries HealthState for a Deal/slot assignment.
  rpc GetDealSlotHealth(QueryGetDealSlotHealthRequest) returns (QueryGetDealSlotHealthResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/deals/{deal_id}/health/slot/{slot}";
  }

  // Lists HealthState entries for a Deal (providers).
  rpc ListDealProviderHealth(QueryListDealProviderHealthRequest) returns (QueryListDealProviderHealthResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/deals/{deal_id}/health/providers";
  }

  // Lists HealthState entries for a Deal (slots).
  rpc ListDealSlotHealth(QueryListDealSlotHealthRequest) returns (QueryListDealSlotHealthResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/deals/{deal_id}/health/slots";
  }

  // Queries the last accepted retrieval receipt nonce for a specific (deal_id, file_path).
  rpc GetReceiptNonce(QueryGetReceiptNonceRequest) returns (QueryGetReceiptNonceResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/deals/{deal_id}/receipt-nonce";
  }

  // Queries a RetrievalSession by id.
  rpc GetRetrievalSession(QueryGetRetrievalSessionRequest) returns (QueryGetRetrievalSessionResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/retrieval-sessions/{session_id}";
  }

  // Lists RetrievalSessions for an owner.
  rpc ListRetrievalSessionsByOwner(QueryListRetrievalSessionsByOwnerRequest) returns (QueryListRetrievalSessionsByOwnerResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/retrieval-sessions/by-owner/{owner}";
  }

  // Lists RetrievalSessions for a provider.
  rpc ListRetrievalSessionsByProvider(QueryListRetrievalSessionsByProviderRequest) returns (QueryListRetrievalSessionsByProviderResponse) {
    option (google.api.http).get = "/nilchain/nilchain/v1/retrieval-sessions/by-provider/{provider}";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message QueryListProofsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryListProofsResponse {
  repeated Proof proof = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryListDealsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryListDealsResponse {
  repeated Deal deals = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGetDealRequest {
  uint64 id = 1;
}

message QueryGetDealResponse {
  Deal deal = 1;
}

message QueryListProvidersRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryListProvidersResponse {
  repeated Provider providers = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGetProviderRequest {
  string address = 1;
}

message QueryGetProviderResponse {
  Provider provider = 1;
}

message QueryGetProviderBondRequest {
  string address = 1;
}

message QueryGetProviderBondResponse {
  ProviderBondState bond = 1;
}

message QueryGetDealHeatRequest {
  uint64 deal_id = 1;
}

message QueryGetDealHeatResponse {
  DealHeatState heat = 1 [(gogoproto.nullable) = false];
}

message QueryGetDealProviderHealthRequest {
  uint64 deal_id = 1;
  string provider = 2;
}

message QueryGetDealProviderHealthResponse {
  HealthState state = 1 [(gogoproto.nullable) = false];
}

message QueryGetDealSlotHealthRequest {
  uint64 deal_id = 1;
  uint32 slot = 2;
}

message QueryGetDealSlotHealthResponse {
  HealthState state = 1 [(gogoproto.nullable) = false];
}

message DealProviderHealthEntry {
  uint64 deal_id = 1;
  string provider = 2;
  HealthState state = 3 [(gogoproto.nullable) = false];
}

message DealSlotHealthEntry {
  uint64 deal_id = 1;
  uint32 slot = 2;
  HealthState state = 3 [(gogoproto.nullable) = false];
}

message QueryListDealProviderHealthRequest {
  uint64 deal_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryListDealProviderHealthResponse {
  repeated DealProviderHealthEntry entries = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryListDealSlotHealthRequest {
  uint64 deal_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryListDealSlotHealthResponse {
  repeated DealSlotHealthEntry entries = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGetReceiptNonceRequest {
  uint64 deal_id = 1;
  string file_path = 2;
}

message QueryGetReceiptNonceResponse {
  uint64 last_nonce = 1;
}

message QueryGetRetrievalSessionRequest {
  bytes session_id = 1;
}

message QueryGetRetrievalSessionResponse {
  RetrievalSession session = 1 [(gogoproto.nullable) = false];
}

message QueryListRetrievalSessionsByOwnerRequest {
  string owner = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryListRetrievalSessionsByOwnerResponse {
  repeated RetrievalSession sessions = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryListRetrievalSessionsByProviderRequest {
  string provider = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryListRetrievalSessionsByProviderResponse {
  repeated RetrievalSession sessions = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}
